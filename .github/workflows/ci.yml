name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check repository structure
        run: python scripts/check_structure.py
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src
      - name: Unit, integration, reference and validation tests
        run: pytest tests/unit tests/integration tests/reference tests/validation
      - name: Build production package
        run: python -m build
      - name: Secret scan
        run: detect-secrets scan --force-use-all-plugins src tests data scripts .github pyproject.toml .env.example
